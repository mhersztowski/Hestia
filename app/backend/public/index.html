<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- `user-scalable=no`: a drawing page handles its own gestures, and a pinch
         that zooms the whole page instead of the canvas looks like broken drawing. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Hestia — CAD</title>
    <style>
      /* The page fills the window: the notes canvas takes its height from the
         parent, and with the default `height: auto` it got zero and had nothing
         to draw on. */
      html, body, #root { height: 100%; margin: 0; }
    </style>
    <script type="module" crossorigin src="/assets/index-BdpGhOiC.js"></script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
